                - heading "SciTopus – Наука и научпоп" [level=3] [ref=f27e1221]
                - generic [ref=f27e1222]:
                  - generic [ref=f27e1223]:
                    - text: "Серия видео с визуализацией в стиле Data is Beautiful — версия научпопа. Это 14 коротких роликов о русскоязычном научпоп-сегменте YT: как росли каналы, кто набирал больше просмотров, подписчиков, лайков и комментариев, какие видео стали самыми заметными, а какие Shorts собрали больше всего внимания. В серии: — рост научпоп YouTube-каналов по просмотрам — рост по подписчикам — рост по лайкам и комментариям — каналы-долгожители — каналы по числу опубликованных видео — лайки и комментарии на 1000 просмотров — самые просматриваемые, комментируемые и залайканные видео — отдельные рейтинги по Shorts В основе — база SciTopus: сотни научно-популярных каналов и ~180 тысяч видео. Для части динамики используется модельная реконструкция: визуализация показывает общую картину роста и сравнения, а не всегда точное значение для каждой отдельной даты. Публикуем все 14 роликов одним циклом. Надеемся, вам будет интересно посмотреть на научпоп YT как на живую динамическую карту, а не просто как на список каналов. Полный плейлист: https://vkvideo.ru/playlist/-112289703_12 Список каналов: https://vk.com/wall-112289703_83488"
